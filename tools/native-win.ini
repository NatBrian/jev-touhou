# Native-file override for the Windows MinGW build (see doc/research-taisei-sim.md).
#
# Meson picks the `gcc-ar`/`gcc-ranlib` GCC-driver wrappers as the archiver when
# CC=gcc ("use gcc-ar if available; needed for LTO"). The MSYS2 gcc-ar wrapper is
# a 75 KB driver shim that re-execs the real binutils in a prefix directory,
# which breaks relative paths: under ninja it fails with
#   ar.exe: src/libtaisei.a: No such file or directory
# (relative output/member paths resolved against the wrong cwd). Plain binutils
# `ar`/`ranlib` handle the identical invocation correctly (tested).
#
# Native-file [binaries] entries take precedence over meson's compiler defaults
# (mesonbuild/compilers/detect.py: env.lookup_binary_entry(machine, 'ar')).

[binaries]
ar = 'ar'
ranlib = 'ranlib'
